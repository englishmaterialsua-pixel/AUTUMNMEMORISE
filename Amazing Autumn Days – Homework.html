<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amazing Autumn Days – Homework</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0E4DA; --card:#FFFFFF; --ink:#2B2220; --muted:#7A675C; --line:#E6D4C7;
  --orange:#E8772E; --orange-d:#C95E18; --mustard:#EAB03F; --olive:#7F8333; --brown:#7A4A2E;
  --lav:#D3CBF7; --lav-ink:#43377F; --sticky:#FBE38A; --sticky-ink:#3A2E10;
  --verb:#D9611A; --prep:#5B4BC4; --ok:#4F8A34; --ok-bg:#DDEFD0; --bad:#C8452E; --bad-bg:#F8D9D1;
  --shadow:0 10px 30px rgba(122,74,46,.14);
  --font-h:"Fraunces",Georgia,"Times New Roman",serif;
  --font-b:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#241A16; --card:#35271F; --ink:#F6EADF; --muted:#BBA596; --line:#4D3A2E;
    --orange:#F28A41; --orange-d:#FFB07A; --mustard:#EDB84F; --olive:#B4B866; --brown:#E0B08E;
    --lav:#4A4180; --lav-ink:#E2DCFF; --sticky:#5E4F1E; --sticky-ink:#FFF1BF;
    --verb:#FF9A55; --prep:#B9AEFF; --ok:#9BD07A; --ok-bg:#2F4425; --bad:#FF907A; --bad-bg:#53281F;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#241A16; --card:#35271F; --ink:#F6EADF; --muted:#BBA596; --line:#4D3A2E;
  --orange:#F28A41; --orange-d:#FFB07A; --mustard:#EDB84F; --olive:#B4B866; --brown:#E0B08E;
  --lav:#4A4180; --lav-ink:#E2DCFF; --sticky:#5E4F1E; --sticky-ink:#FFF1BF;
  --verb:#FF9A55; --prep:#B9AEFF; --ok:#9BD07A; --ok-bg:#2F4425; --bad:#FF907A; --bad-bg:#53281F;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-weight:500;font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}

/* falling leaves */
#leaves{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#leaves span{position:absolute;top:-60px;opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#leaves{display:none}.fci{transition:none!important}*{animation:none!important}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(16px,3vw,48px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand{border:0;background:none;font-family:var(--font-h);font-weight:800;font-size:22px;display:flex;align-items:center;gap:8px;padding:6px 0}
.topr{display:flex;align-items:center;gap:10px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;white-space:nowrap}
.icon{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:18px}
.wrap{position:relative;z-index:1;width:100%;padding:8px clamp(16px,3vw,48px) 60px}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(16px,3vw,40px);align-items:center;margin:10px 0 28px}
.sticker{display:inline-block;background:var(--orange);color:#fff;font-weight:800;border-radius:999px;padding:6px 16px;transform:rotate(-3deg);margin-bottom:12px}
:root[data-theme="dark"] .sticker{color:#2B1305}
h1{font-family:var(--font-h);font-weight:800;font-size:clamp(40px,7vw,96px);line-height:.98;margin:0 0 14px;letter-spacing:-.02em}
h2{font-family:var(--font-h);font-weight:800;font-size:clamp(26px,3.2vw,40px);margin:36px 0 14px}
.lead{font-size:clamp(17px,1.6vw,22px);max-width:34em;margin:0 0 18px;color:var(--muted)}
.lead b{color:var(--ink)}
.bigbar{height:18px;background:var(--card);border:2px solid var(--line);border-radius:999px;overflow:hidden;max-width:560px}
.bigbar div{height:100%;background:linear-gradient(90deg,var(--mustard),var(--orange));border-radius:999px;transition:width .6s}
.barlbl{font-weight:800;margin:6px 0 14px;color:var(--muted);font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:15px;font-weight:700}
.hero-r{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:420px;justify-self:center;width:100%}
.hero-r span{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(48px,7vw,92px);border-radius:38% 62% 55% 45%/50% 40% 60% 50%;background:var(--card);box-shadow:var(--shadow)}
.hero-r span:nth-child(2){background:var(--mustard)}
.hero-r span:nth-child(3){background:var(--lav)}
.hero-r span:nth-child(4){background:var(--sticky)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}
.tile{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);position:relative}
.tile.btn-t{transition:transform .15s,border-color .15s}
.tile.btn-t:hover{transform:translateY(-4px);border-color:var(--orange)}
.badge{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:28px;margin-bottom:4px}
.tile h3{font-family:var(--font-h);font-size:24px;margin:0}
.tile p{margin:0;color:var(--muted);font-size:16px}
.mini{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mini button,.seg button{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px}
.mini button:hover{border-color:var(--orange);background:var(--sticky)}
.tip{margin-top:26px;background:var(--sticky);color:var(--sticky-ink);border-radius:6px 26px 26px 26px;padding:20px 24px;box-shadow:var(--shadow);transform:rotate(-.6deg);max-width:900px}
.tip b{font-family:var(--font-h);font-size:20px}
.tip p{margin:6px 0 0}

/* phrase list */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.pi{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 16px}
.pi .e{font-size:34px}
.pi .t{flex:1;min-width:0}
.pi .en{font-size:19px;font-weight:700}
.pi .ru{font-size:15px;color:var(--muted)}
.pips{display:flex;gap:3px}
.pips i{width:8px;height:18px;border-radius:4px;background:var(--line)}
.pips i.on{background:var(--olive)}
.reset{margin-top:30px;border:0;background:none;color:var(--muted);text-decoration:underline;font-weight:700}

/* colour-coded phrase */
.w.v{color:var(--verb);font-weight:800}
.w.pr{color:var(--prep);font-weight:800;border-bottom:4px solid var(--prep);border-radius:2px}
.w.ar{color:var(--olive);font-weight:800}
.w.nw{background:var(--lav);color:var(--lav-ink);border-radius:10px;padding:0 .28em;font-weight:800}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg .w{font-size:15px}

/* nav row */
.navrow{display:flex;align-items:center;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.back{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:800}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button.on{background:var(--orange);border-color:var(--orange);color:#fff}
:root[data-theme="dark"] .seg button.on{color:#2B1305}
.stage{width:100%;max-width:1280px;margin:0 auto}
.qbar{height:12px;background:var(--card);border:2px solid var(--line);border-radius:999px;overflow:hidden}
.qfill{height:100%;background:linear-gradient(90deg,var(--mustard),var(--orange));transition:width .4s}
.qmeta{text-align:right;font-weight:800;color:var(--muted);font-size:15px;margin:4px 4px 10px}

/* flashcard */
.fc{perspective:1500px;width:100%;max-width:1000px;margin:8px auto 0;height:clamp(320px,52vh,540px);cursor:pointer}
.fci{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.fc.flip .fci{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:34px;background:var(--card);border:3px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--sticky);color:var(--sticky-ink);border-color:var(--mustard)}
.face.back .w.v,.face.back .w.pr,.face.back .w.ar{color:inherit}
.face.back .w.v{color:var(--verb)}
.face.back .w.pr{color:var(--prep)}
:root:not([data-theme="dark"]) .face.back .w.ar{color:#6A6E22}
.bigE{font-size:clamp(90px,16vw,190px);line-height:1}
.smallE{font-size:clamp(40px,6vw,70px);line-height:1}
.ruBig{font-family:var(--font-h);font-weight:800;font-size:clamp(28px,5vw,60px);line-height:1.1}
.defBig{font-family:var(--font-h);font-weight:600;font-size:clamp(24px,3.8vw,44px);line-height:1.2;max-width:22em}
.enBig{font-family:var(--font-h);font-weight:800;font-size:clamp(30px,5.4vw,70px);line-height:1.15}
.hint{color:var(--muted);font-size:16px;font-weight:700}
.face.back .hint{color:inherit;opacity:.75}
.lbl{background:var(--lav);color:var(--lav-ink);border-radius:999px;padding:3px 14px;font-weight:800;font-size:15px}
.say{border:2px solid currentColor;background:transparent;border-radius:999px;padding:6px 16px;font-weight:800;font-size:16px}
.actions{display:flex;gap:14px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:14px 30px;font-weight:800;font-size:19px;background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-d)}
:root[data-theme="dark"] .btn{color:#2B1305}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--orange-d)}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:none}
.btn.ok{background:var(--olive);box-shadow:0 4px 0 #5d6024;color:#fff}
:root[data-theme="dark"] .btn.ok{color:#1d1f08}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* quiz common */
.prompt{background:var(--card);border:3px solid var(--line);border-radius:30px;padding:clamp(18px,3vw,36px);box-shadow:var(--shadow);text-align:center;margin-bottom:18px}
.prompt .pe{font-size:clamp(60px,10vw,110px);line-height:1}
.prompt .pru{font-family:var(--font-h);font-weight:800;font-size:clamp(28px,4.6vw,56px);line-height:1.1;margin-top:8px}
.prompt .task{font-weight:800;color:var(--muted);font-size:15px;margin-bottom:6px}
.zone{min-height:84px;border:3px dashed var(--mustard);border-radius:24px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:color-mix(in srgb,var(--card) 70%,transparent)}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0}
.tl{border:3px solid var(--line);background:var(--card);border-radius:18px;padding:10px 20px;font-weight:800;font-size:clamp(20px,2.6vw,30px);box-shadow:0 4px 0 var(--line);transition:transform .1s}
.tl:hover{transform:translateY(-2px)}
.tl.ghost{opacity:.25;box-shadow:none;pointer-events:none}
.tl.good{background:var(--ok-bg);border-color:var(--ok)}
.tl.bad{background:var(--bad-bg);border-color:var(--bad)}
.msg{font-weight:800;margin:12px 0;text-align:center}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.answerbox{background:var(--sticky);color:var(--sticky-ink);border-radius:24px;padding:18px 22px;text-align:center;margin:14px 0;box-shadow:var(--shadow)}
.answerbox .enBig{font-size:clamp(26px,4vw,48px)}
.answerbox .w.v{color:var(--verb)}.answerbox .w.pr{color:var(--prep)}
:root:not([data-theme="dark"]) .answerbox .w.ar{color:#6A6E22}
.field{width:100%;font:inherit;font-size:clamp(22px,3vw,34px);font-weight:700;text-align:center;padding:16px 18px;border-radius:22px;border:3px solid var(--line);background:var(--card);color:var(--ink)}
.field:focus{border-color:var(--orange);outline:none}
.mask{text-align:center;font-family:var(--font-h);font-weight:800;font-size:clamp(22px,3.2vw,38px);letter-spacing:.14em;margin:14px 0;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 26px;justify-content:center;min-height:1.4em}
.chip2{display:inline-block;border-radius:14px;padding:6px 14px;font-weight:800;font-size:clamp(18px,2.4vw,26px);margin:3px}
.chip2.good{background:var(--ok-bg);color:var(--ok)}
.chip2.bad{background:var(--bad-bg);color:var(--bad)}
.sentence{font-family:var(--font-h);font-weight:800;font-size:clamp(28px,5vw,64px);line-height:1.3;text-align:center;margin:8px 0 22px}
.blank{display:inline-block;min-width:3.2em;border-bottom:6px solid var(--mustard);color:transparent;border-radius:4px}
.blank.fill{color:var(--ok);border-color:var(--ok)}
.blank.wrong{color:var(--bad);border-color:var(--bad)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;max-width:900px;margin:0 auto}
.opts .tl{font-size:clamp(20px,2.8vw,32px);padding:16px}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,3vw,40px)}
.mcol{display:flex;flex-direction:column;gap:12px}
.mt{border:3px solid var(--line);background:var(--card);border-radius:20px;padding:14px 16px;font-weight:800;font-size:clamp(17px,2.2vw,26px);box-shadow:0 4px 0 var(--line);min-height:68px;display:flex;align-items:center;justify-content:center;text-align:center}
.mt.sel{border-color:var(--orange);background:var(--sticky);color:var(--sticky-ink)}
.mt.done{background:var(--ok-bg);border-color:var(--ok);opacity:.6;pointer-events:none;box-shadow:none}
.mt.shake{border-color:var(--bad);background:var(--bad-bg);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* summary */
.sum{text-align:center;max-width:760px;margin:20px auto}
.sum .bigE{font-size:110px}
.sum h2{margin:10px 0}
.missed{display:flex;flex-direction:column;gap:8px;margin:18px 0;text-align:left}
.missed .pi .en{font-size:20px}

@media (max-width:760px){
  body{font-size:17px}
  .hero{grid-template-columns:1fr}
  .hero-r{grid-template-columns:repeat(4,1fr);max-width:none}
  .hero-r span{font-size:36px}
  .brand span{font-size:19px}
  .plist{grid-template-columns:1fr}
  .tl{padding:9px 14px}
  .fc{height:clamp(300px,58vh,480px)}
  .btn{padding:13px 22px;font-size:18px}
}
</style>
</head>
<body>
<div id="leaves" aria-hidden="true"></div>
<header class="top">
  <button class="brand" onclick="home()" aria-label="Back to menu">🍂 <span>Autumn Days</span></button>
  <div class="topr">
    <span class="chip" id="chip">⭐ 0%</span>
    <button class="icon" onclick="toggleTheme()" aria-label="Light or dark mode">🌓</button>
  </div>
</header>
<main id="view" class="wrap"></main>

<script>
/* ============ DATA ============ */
const P=[
 {en:"drink hot cocoa",ru:"пить горячее какао",e:"☕"},
 {en:"read under a blanket",ru:"читать под пледом",e:"📖"},
 {en:"collect autumn leaves",ru:"собирать осенние листья",e:"🍂"},
 {en:"try knitting or crocheting",ru:"попробовать вязание спицами или крючком",e:"🧶"},
 {en:"go mushroom picking",ru:"пойти за грибами",e:"🍄"},
 {en:"go to the forest",ru:"пойти в лес",e:"🌲"},
 {en:"light a scented candle",ru:"зажечь ароматическую свечу",e:"🕯️"},
 {en:"bake an apple pie",ru:"испечь яблочный пирог",e:"🥧"},
 {en:"take an evening walk",ru:"прогуляться вечером",e:"🚶"},
 {en:"binge-watch series",ru:"смотреть сериалы запоем",e:"📺"},
 {en:"organise a picnic",ru:"организовать пикник",e:"🧺"},
 {en:"travel to the mountains",ru:"путешествовать в горы",e:"⛰️"},
 {en:"carve a pumpkin",ru:"вырезать тыкву",e:"🎃"},
 {en:"go to a fall market",ru:"пойти на осеннюю ярмарку",e:"🍎"},
 {en:"visit a corn maze",ru:"посетить кукурузный лабиринт",e:"🌽"},
 {en:"wear rain boots",ru:"носить резиновые сапоги",e:"🥾"},
 {en:"take pictures of autumn views",ru:"фотографировать осенние виды",e:"📸"},
 {en:"celebrate Halloween",ru:"отмечать Хэллоуин",e:"👻"}
];
const W=[
 {w:"knitting",ru:"вязание (спицами)",def:"making clothes from wool using two long needles",e:"🧶",ex:"try knitting or crocheting"},
 {w:"crocheting",ru:"вязание (крючком)",def:"making things from thread using one hooked needle",e:"🪡",ex:"try knitting or crocheting"},
 {w:"scented",ru:"ароматизированный, ароматный",def:"having a pleasant smell, e.g. a candle",e:"🕯️",ex:"light a scented candle"},
 {w:"binge-watch",ru:"смотреть запоем",def:"to watch many episodes of a series one after another",e:"📺",ex:"binge-watch series"},
 {w:"carve",ru:"вырезать",def:"to cut a shape or a face into something hard, like a pumpkin",e:"🎃",ex:"carve a pumpkin"},
 {w:"fall",ru:"осень (американский вариант)",def:"the American word for the season after summer",e:"🍂",ex:"go to a fall market"},
 {w:"views",ru:"виды, пейзажи",def:"beautiful things you can see in nature, like hills and trees",e:"🏞️",ex:"take pictures of autumn views"}
];
const PR=new Set(["under","to","of"]);
const AR=new Set(["a","an","the"]);
const NEW=new Set(["knitting","crocheting","scented","binge-watch","carve","fall","views"]);
const CONF=["make","do","have","get","take","go","put","play","see","give"];
const PD=["in","on","at","for","with","by","about","from","under","to","of"];
const MAX=6;

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const view=$('#view');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick1=a=>a[Math.random()*a.length|0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/organize/g,'organise').replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim();
function fmt(en){
  return en.split(' ').map((w,i)=>{
    let c='';
    if(i===0)c+=' v';
    if(PR.has(w))c+=' pr';
    if(AR.has(w))c+=' ar';
    if(NEW.has(w))c+=' nw';
    return `<span class="w${c}">${esc(w)}</span>`;
  }).join(' ');
}
function say(t){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='en-US';u.rate=.88;
    speechSynthesis.speak(u);
  }catch(e){}
}
const sayBtn=(t,cls='say')=>`<button class="${cls}" data-t="${esc(t)}" onclick="event.stopPropagation();say(this.dataset.t)">🔊 Listen</button>`;

/* ============ PROGRESS ============ */
let lv={};
try{lv=JSON.parse(localStorage.getItem('autumnHW')||'{}')||{}}catch(e){lv={}}
function save(){try{localStorage.setItem('autumnHW',JSON.stringify(lv))}catch(e){}}
function bump(en,d){lv[en]=Math.max(0,Math.min(MAX,(lv[en]||0)+d));save();updChip();}
function mastery(){return Math.round(P.reduce((s,p)=>s+(lv[p.en]||0),0)/(P.length*MAX)*100)}
function updChip(){const c=$('#chip');if(c)c.textContent='⭐ '+mastery()+'%'}
function pickItems(n){
  return shuffle(shuffle(P).map(p=>({p,s:(lv[p.en]||0)+Math.random()*1.5})).sort((a,b)=>a.s-b.s).slice(0,n).map(x=>x.p));
}
const pips=en=>`<div class="pips" title="Your level">${Array.from({length:MAX},(_,i)=>`<i class="${i<(lv[en]||0)?'on':''}"></i>`).join('')}</div>`;

try{const t=localStorage.getItem('autumnTheme');if(t)document.documentElement.dataset.theme=t}catch(e){}

/* ============ NAV ============ */
let cur='home',NEXT=null;
function h(html){view.innerHTML=html;window.scrollTo(0,0);updChip();}
const navRow=(extra='')=>`<div class="navrow"><button class="back" onclick="home()">← Menu</button>${extra}</div>`;
const legend=`<span class="lg"><span class="w v">verb</span></span><span class="lg"><span class="w pr">preposition</span></span><span class="lg"><span class="w nw">new word</span></span>`;

function home(){
  cur='home';NEXT=null;
  const pct=mastery();
  h(`
  <section class="hero">
    <div>
      <span class="sticker">Homework</span>
      <h1>Amazing<br>Autumn Days</h1>
      <p class="lead">Learn the <b>whole phrase</b>: which verb, which preposition, which word order. Say every phrase out loud. 10–15 minutes a day is enough.</p>

      <div class="legend">${legend}</div>
    </div>
    <div class="hero-r" aria-hidden="true"><span>🍂</span><span>🎃</span><span>☕</span><span>🍄</span></div>
  </section>

  <section class="tiles">
    <div class="tile">
      <div class="badge" style="background:var(--mustard)">🃏</div>
      <h3>Flashcards</h3>
      <p>Flip the card and say the phrase before you look.</p>
      <div class="mini">
        <button onclick="startFC('pic')">🖼 Picture → phrase</button>
        <button onclick="startFC('ru')">🇷🇺 Russian → English</button>
        <button onclick="startFC('def')">📖 Definition → word</button>
      </div>
    </div>
    <button class="tile btn-t" onclick="startQ('build')">
      <div class="badge" style="background:var(--orange)">🧩</div>
      <h3>Build the phrase</h3>
      <p>Put the words in the right order. Beware of the extra words!</p>
    </button>
    <button class="tile btn-t" onclick="startQ('gap')">
      <div class="badge" style="background:var(--lav)">🕳️</div>
      <h3>Fill the gap</h3>
      <p>Choose the right verb or preposition.</p>
    </button>
    <button class="tile btn-t" onclick="startQ('type')">
      <div class="badge" style="background:var(--olive);color:#fff">⌨️</div>
      <h3>Recall and type</h3>
      <p>See the Russian. Write the full English phrase from memory.</p>
    </button>
    <button class="tile btn-t" onclick="startMatch()">
      <div class="badge" style="background:var(--sticky)">🔗</div>
      <h3>Match pairs</h3>
      <p>Connect each English phrase with its translation.</p>
    </button>
  </section>

  <aside class="tip">
    <b>How to use this page</b>
    <p>Day 1: Flashcards (all three types). Day 2: Build the phrase + Fill the gap. Day 3: Recall and type + Match pairs. Repeat until the bar is full!</p>
  </aside>

  <h2>All phrases</h2>
  <div class="plist">
    ${P.map(p=>`<div class="pi"><div class="e">${p.e}</div><div class="t"><div class="en">${fmt(p.en)}</div><div class="ru">${p.ru}</div></div>${pips(p.en)}</div>`).join('')}
  </div>
  <button class="reset" onclick="resetAll()">Reset my progress</button>
  `);
}
function resetAll(){if(confirm('Reset all progress?')){lv={};save();home();}}

/* ============ SUMMARY ============ */
function summary(emoji,title,text,again,missed=[]){
  NEXT=null;
  h(`${navRow()}<div class="sum"><div class="bigE">${emoji}</div><h2>${title}</h2><p class="lead" style="margin-inline:auto">${text}</p>
  ${missed.length?`<h3 style="font-family:var(--font-h)">Repeat these:</h3><div class="missed">${missed.map(p=>`<div class="pi"><div class="e">${p.e}</div><div class="t"><div class="en">${fmt(p.en)}</div><div class="ru">${p.ru}</div></div></div>`).join('')}</div>`:''}
  <div class="actions"><button class="btn" onclick="${again}">Play again</button><button class="btn alt" onclick="home()">Menu</button></div></div>`);
}

/* ============ 1. FLASHCARDS ============ */
let F;
function startFC(mode){
  const deck=mode==='def'?W.map(x=>({...x,k:'w'})):P.map(x=>({...x,k:'p'}));
  F={mode,q:shuffle(deck),i:0,done:0,flip:false};
  cur='fc';renderFC();
}
function renderFC(){
  if(F.i>=F.q.length){
    summary('🎉','All cards done!',`You went through ${F.done} cards. Now try "Build the phrase" or "Recall and type".`,`startFC('${F.mode}')`);
    return;
  }
  const c=F.q[F.i],m=F.mode;
  let front,back;
  if(c.k==='p'){
    front=m==='pic'
      ?`<div class="bigE">${c.e}</div><div class="hint">What is the phrase in English? Say it aloud, then flip.</div>`
      :`<div class="smallE">${c.e}</div><div class="ruBig">${c.ru}</div><div class="hint">Say the whole phrase in English, then flip.</div>`;
    back=`<div class="smallE">${c.e}</div><div class="enBig">${fmt(c.en)}</div><div class="hint">${c.ru}</div>${sayBtn(c.en)}`;
  }else{
    front=`<div class="smallE">${c.e}</div><span class="lbl">Definition</span><div class="defBig">${esc(c.def)}</div><div class="hint">Which word is it?</div>`;
    back=`<div class="enBig"><span class="w nw">${esc(c.w)}</span></div><div class="hint">${c.ru}</div><div class="hint">Example:</div><div class="defBig" style="font-size:clamp(22px,3vw,34px)">${fmt(c.ex)}</div>${sayBtn(c.w)}`;
  }
  const seg=[['pic','🖼 Picture → phrase'],['ru','🇷🇺 Russian → English'],['def','📖 Definition → word']]
    .map(([k,l])=>`<button class="${k===m?'on':''}" onclick="startFC('${k}')">${l}</button>`).join('');
  h(`${navRow(`<div class="seg">${seg}</div>`)}
  <div class="stage">
    <div class="qbar"><div class="qfill" style="width:${F.i/F.q.length*100}%"></div></div>
    <div class="qmeta">${F.q.length-F.i} cards left</div>
    <div class="fc ${F.flip?'flip':''}" id="fc" onclick="flipFC()" role="button" tabindex="0" aria-label="Flip card">
      <div class="fci"><div class="face">${front}</div><div class="face back">${back}</div></div>
    </div>
    <div class="actions" id="fcact"></div>
  </div>`);
  F.flip=false;fcActions();
}
function fcActions(){
  $('#fcact').innerHTML=F.flip
    ?`<button class="btn alt" onclick="fcAnswer(false)">🔁 Again</button><button class="btn ok" onclick="fcAnswer(true)">✓ I knew it</button>`
    :`<button class="btn" onclick="flipFC()">Flip the card</button>`;
}
function flipFC(){
  F.flip=!F.flip;
  $('#fc').classList.toggle('flip',F.flip);
  fcActions();
}
function fcAnswer(ok){
  if(!F.flip)return;
  const c=F.q[F.i];
  if(ok){F.done++;if(c.k==='p')bump(c.en,1);}
  else{F.q.splice(Math.min(F.i+4,F.q.length),0,c);}
  F.i++;F.flip=false;renderFC();
}

/* ============ QUIZ ENGINE (build / gap / type) ============ */
let Q;
function startQ(kind){
  cur='q';
  Q={kind,items:pickItems(10),i:0,score:0,missed:[]};
  nextQ();
}
function nextQ(){
  NEXT=null;
  if(Q.i>=Q.items.length){
    const s=Q.score,n=Q.items.length;
    const e=s>=9?'🏆':s>=6?'🍁':'🌱';
    const t=s>=9?'Excellent!':s>=6?'Good job!':'Keep practising!';
    summary(e,t,`${s} of ${n} correct at the first try.`,`startQ('${Q.kind}')`,Q.missed);
    return;
  }
  const it=Q.items[Q.i];
  ({build:rBuild,gap:rGap,type:rType})[Q.kind](it);
}
function frame(task,it,inner){
  h(`${navRow()}<div class="stage">
    <div class="qbar"><div class="qfill" style="width:${Q.i/Q.items.length*100}%"></div></div>
    <div class="qmeta">${Q.i+1} / ${Q.items.length}</div>
    <div class="prompt"><div class="task">${task}</div><div class="pe">${it.e}</div><div class="pru">${it.ru}</div></div>
    ${inner}</div>`);
}
function result(it,first,delta){
  if(first)Q.score++;else if(!Q.missed.includes(it))Q.missed.push(it);
  bump(it.en,delta);
}
const nextBtn=()=>`<div class="actions"><button class="btn" onclick="Q.i++;nextQ()">Next →</button></div>`;
const reveal=(it,ok,msg)=>`<div class="msg ${ok?'ok':'bad'}">${msg}</div><div class="answerbox"><div class="enBig">${fmt(it.en)}</div><div style="margin-top:10px">${sayBtn(it.en)}</div></div>${nextBtn()}`;

/* ---- Build the phrase ---- */
let B;
function rBuild(it){
  const words=it.en.split(' ');
  const d=[pick1(PD.filter(x=>!words.includes(x))),pick1(CONF.filter(x=>!words.includes(x)))];
  const tiles=shuffle([...words,...d].map((w,id)=>({id,w})));
  B={it,words,tiles,ans:[],tries:0,st:'play'};
  drawBuild();
}
function drawBuild(){
  const it=B.it,T=id=>B.tiles.find(t=>t.id===id);
  const mark=B.st==='wrong';
  const ansHTML=B.ans.map((id,i)=>{
    const cls=mark?(T(id).w===B.words[i]?' good':' bad'):'';
    return `<button class="tl${cls}" onclick="bDrop(${id})">${esc(T(id).w)}</button>`;
  }).join('')||`<span class="hint">Tap the words in the right order</span>`;
  const pool=B.tiles.map(t=>`<button class="tl${B.ans.includes(t.id)?' ghost':''}" onclick="bPick(${t.id})">${esc(t.w)}</button>`).join('');
  let foot='';
  if(B.st==='play')foot=`<div class="actions"><button class="btn alt" onclick="bReset()">Clear</button><button class="btn" onclick="bCheck()" ${B.ans.length?'':'disabled'}>Check</button></div>`;
  else if(B.st==='wrong')foot=`<div class="msg bad">Not quite. Look at the red words: check the verb, the preposition and the order.</div><div class="actions"><button class="btn" onclick="bReset()">Try again</button></div>`;
  frame('Build the English phrase. There are 2 extra words!',it,
    `<div class="zone">${ansHTML}</div>${B.st==='ok'||B.st==='show'?'':`<div class="pool">${pool}</div>`}${foot}`);
  if(B.st==='ok'||B.st==='show'){
    $('.stage').insertAdjacentHTML('beforeend',reveal(it,B.st==='ok',B.st==='ok'?'Correct! 🍁':'Here is the right phrase:'));
    NEXT=()=>{Q.i++;nextQ()};
  }
}
function bPick(id){if(B.st!=='play')return;B.ans.push(id);drawBuild()}
function bDrop(id){if(B.st!=='play')return;B.ans=B.ans.filter(x=>x!==id);drawBuild()}
function bReset(){B.ans=[];B.st='play';drawBuild()}
function bCheck(){
  const txt=B.ans.map(id=>B.tiles.find(t=>t.id===id).w).join(' ');
  if(txt===B.it.en){result(B.it,B.tries===0,B.tries===0?1:0);B.st='ok';}
  else{
    B.tries++;
    if(B.tries>=2){result(B.it,false,-1);B.st='show';}else B.st='wrong';
  }
  drawBuild();
}

/* ---- Fill the gap ---- */
let G;
function rGap(it){
  const w=it.en.split(' '),c=[];
  w.forEach((x,i)=>{if(i===0)c.push({i,t:'verb'});else if(PR.has(x))c.push({i,t:'prep'},{i,t:'prep'})});
  const g=pick1(c),right=w[g.i];
  const pool=g.t==='verb'?CONF:PD;
  const opts=shuffle([right,...shuffle(pool.filter(x=>x!==right)).slice(0,3)]);
  G={it,w,g,right,opts,st:'play'};
  const sent=w.map((x,i)=>i===g.i?`<span class="blank" id="blank">${esc(right)}</span>`:`<span>${esc(x)}</span>`).join(' ');
  frame(g.t==='verb'?'Choose the missing verb':'Choose the missing preposition',it,
    `<div class="sentence" id="sent">${sent}</div>
     <div class="opts" id="opts">${opts.map(o=>`<button class="tl" onclick="gPick(this,'${o}')">${o}</button>`).join('')}</div>`);
}
function gPick(btn,o){
  if(G.st!=='play')return;
  G.st='done';
  const ok=o===G.right,bl=$('#blank');
  bl.classList.add(ok?'fill':'wrong');
  if(!ok){bl.textContent=o;}
  document.querySelectorAll('#opts .tl').forEach(b=>{
    b.disabled=true;
    if(b.textContent===G.right)b.classList.add('good');
    else if(b===btn)b.classList.add('bad');
    else b.classList.add('ghost');
  });
  result(G.it,ok,ok?1:-1);
  $('.stage').insertAdjacentHTML('beforeend',reveal(G.it,ok,ok?'Correct! 🍁':`The right answer is “${esc(G.right)}”.`));
  NEXT=()=>{Q.i++;nextQ()};
}

/* ---- Recall and type ---- */
let T;
function rType(it){
  T={it,tries:0,hint:0,st:'play'};
  frame('Write the full phrase in English',it,
    `<div class="mask" id="mask"></div>
     <input class="field" id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type the phrase here…" aria-label="Your answer">
     <div id="fb"></div>
     <div class="actions" id="tact"><button class="btn alt" onclick="tHint()">💡 Hint</button><button class="btn" onclick="tCheck()">Check</button></div>`);
  drawMask();
  const inp=$('#ans');
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.stopPropagation();if(T.st==='play')tCheck();}});
  try{inp.focus({preventScroll:true})}catch(e){}
}
function drawMask(){
  const ws=T.it.en.split(' ');
  $('#mask').innerHTML=ws.map((w,j)=>{
    let s;
    if(T.hint>=2&&j<T.hint-1)s=w;
    else if(T.hint>=1)s=w[0]+'_'.repeat(w.length-1);
    else s='_'.repeat(w.length);
    return `<span>${esc(s)}</span>`;
  }).join('');
}
function tHint(){
  if(T.st!=='play')return;
  T.hint=Math.min(T.hint+1,T.it.en.split(' ').length+1);
  drawMask();$('#ans').focus();
}
function tCheck(){
  if(T.st!=='play')return;
  const v=$('#ans').value;
  if(!norm(v))return;
  if(norm(v)===norm(T.it.en)){tEnd('ok');return;}
  T.tries++;
  if(T.tries>=3){tEnd('show');return;}
  const u=norm(v).split(' '),t=T.it.en.split(' ');
  const chips=u.map((w,i)=>`<span class="chip2 ${w===t[i]?'good':'bad'}">${esc(w)}</span>`).join('');
  $('#fb').innerHTML=`<div style="text-align:center;margin-top:12px">${chips}</div><div class="msg bad">Not quite. Check the red words: the verb, the preposition and the order. ${3-T.tries} ${3-T.tries===1?'try':'tries'} left.</div>`;
  $('#ans').focus();
}
function tEnd(st){
  T.st=st;
  const clean=st==='ok'&&T.tries===0&&T.hint===0;
  if(st==='ok')result(T.it,clean,clean?2:1);else result(T.it,false,-1);
  $('#ans').disabled=true;
  $('#tact').remove();
  $('#mask').style.display='none';
  $('#fb').innerHTML=reveal(T.it,st==='ok',st==='ok'?(clean?'Perfect! 🍁':'Correct! Try without a hint next time.'):'Here is the right phrase:');
  NEXT=()=>{Q.i++;nextQ()};
}

/* ============ 5. MATCH PAIRS ============ */
let M;
function startMatch(){
  cur='match';
  const all=shuffle(P);
  M={rounds:[all.slice(0,6),all.slice(6,12),all.slice(12,18)],r:0,mist:0};
  roundM();
}
function roundM(){
  const it=M.rounds[M.r];
  M.left=shuffle(it);M.right=shuffle(it);M.a=null;M.b=null;M.ok=new Set();M.bad=null;
  drawM();
}
function drawM(){
  const L=M.left.map((p,i)=>`<button class="mt ${M.ok.has(p.en)?'done':''} ${M.a===i?'sel':''} ${M.bad&&M.bad.a===i?'shake':''}" onclick="mTap('a',${i})"><span>${fmt(p.en)}</span></button>`).join('');
  const R=M.right.map((p,i)=>`<button class="mt ${M.ok.has(p.en)?'done':''} ${M.b===i?'sel':''} ${M.bad&&M.bad.b===i?'shake':''}" onclick="mTap('b',${i})">${p.ru}</button>`).join('');
  const fin=M.ok.size===M.left.length;
  h(`${navRow()}<div class="stage">
    <div class="qbar"><div class="qfill" style="width:${(M.r*6+M.ok.size)/18*100}%"></div></div>
    <div class="qmeta">Round ${M.r+1} / 3 · mistakes: ${M.mist}</div>
    <div class="mgrid"><div class="mcol">${L}</div><div class="mcol">${R}</div></div>
    ${fin?`<div class="msg ok">Round complete! 🍁</div><div class="actions"><button class="btn" onclick="mNext()">${M.r<2?'Next round →':'Finish'}</button></div>`:''}
  </div>`);
  if(fin)NEXT=mNext;else NEXT=null;
}
function mTap(side,i){
  if(side==='a')M.a=(M.a===i?null:i);else M.b=(M.b===i?null:i);
  if(M.a!==null&&M.b!==null){
    const x=M.left[M.a],y=M.right[M.b];
    if(x.en===y.en){M.ok.add(x.en);M.a=null;M.b=null;}
    else{
      M.mist++;M.bad={a:M.a,b:M.b};M.a=null;M.b=null;
      drawM();
      setTimeout(()=>{M.bad=null;drawM()},450);
      return;
    }
  }
  drawM();
}
function mNext(){
  NEXT=null;
  if(M.r<2){M.r++;roundM();}
  else summary(M.mist<=3?'🏆':'🍁',M.mist===0?'Perfect match!':'All pairs found!',`Mistakes: ${M.mist}. Next, try “Recall and type” for a real memory test.`,'startMatch()');
}

/* ============ KEYS ============ */
document.addEventListener('keydown',e=>{
  const tag=document.activeElement&&document.activeElement.tagName;
  if(cur==='fc'&&F){
    if(e.key===' '||e.key==='Enter'){if(tag==='BUTTON')return;e.preventDefault();flipFC();}
    else if(e.key==='ArrowRight'&&F.flip)fcAnswer(true);
    else if(e.key==='ArrowLeft'&&F.flip)fcAnswer(false);
    return;
  }
  if(NEXT&&e.key==='Enter'&&tag!=='BUTTON'&&tag!=='INPUT'){e.preventDefault();NEXT();}
});

home();
</script>
